<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101116">
<meta name="description" content="Practice real English conversations with Ghost Speak: short lessons, useful phrases, and gentle local progress tracking.">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Ghost Speak">
<title>Ghost Speak · English practice</title>
<style>
:root{color-scheme:dark;background:#101116;color:#f6f5fc;font-family:ui-rounded,"SF Pro Rounded",system-ui,-apple-system,sans-serif}*{box-sizing:border-box}body{margin:0;min-height:100svh;display:grid;place-items:center;background:radial-gradient(ellipse at 70% 10%,#40305d80,transparent 55%),#101116}.loading{width:min(100%,430px);padding:48px 28px;text-align:center}.ghost{width:100px;height:108px;filter:drop-shadow(0 0 28px #beaaff55);animation:float 4s ease-in-out infinite}h1{font-size:2rem;letter-spacing:-.04em;margin:18px 0 8px}p{color:#bebbcf;line-height:1.6;margin:0 0 24px}span{font-size:.8rem;color:#8be4c5}a{color:#beaaff}@keyframes float{50%{transform:translateY(-6px)}}@media(prefers-reduced-motion:reduce){.ghost{animation:none}}
</style>
<script>
// One-way entry point. The whole learning app lives in ghost-speak-web.html, so the existing
// localStorage origin/key and all learning logic are reused.
// The entry=index marker makes this shell redirect at most once: if a host ever serves this
// shell again for that URL, it stops here instead of bouncing between the two files.
(function(){
try{
if(!/[?&]entry=index(&|$)/.test(location.search))location.replace('ghost-speak-web.html?entry=index');
}catch(error){}
})();
</script>
</head>
<body>
<main class="loading">
<svg class="ghost" viewBox="0 0 160 170" role="img" aria-label="Your friendly Ghost companion"><defs><radialGradient id="ghostGlow"><stop stop-color="#fff9ff"/><stop offset=".65" stop-color="#dfd3ff"/><stop offset="1" stop-color="#a994e6"/></radialGradient></defs><path d="M36 130C31 102 33 62 49 42C66 20 100 22 116 45C130 66 124 101 135 129C140 145 124 149 112 142C100 135 98 154 84 151C72 150 71 137 59 144C44 154 29 147 36 130Z" fill="url(#ghostGlow)" stroke="#e6dcff" stroke-width="2"/><ellipse cx="62" cy="82" rx="4" ry="6" fill="#4e3b65"/><ellipse cx="99" cy="82" rx="4" ry="6" fill="#4e3b65"/><path d="M73 96Q81 104 89 96" fill="none" stroke="#4e3b65" stroke-width="3" stroke-linecap="round"/></svg>
<h1>Ghost Speak.</h1><p id="message">Opening your next small step in English…</p><span>Your learning stays in this browser.</span>
<noscript><p>Ghost Speak needs JavaScript for lessons and saving progress. Enable it, then reload.</p></noscript>
<p><a id="open" href="ghost-speak-web.html">Open Ghost Speak</a></p>
</main>
<script>
// No second redirect here on purpose: exactly one script decides where to go, so the shell and
// the app can never bounce. This only makes the visible fallback obvious if the head redirect
// did not happen (script blocked, file missing, or the host served this shell again).
setTimeout(function(){
var message=document.getElementById('message'),link=document.getElementById('open');
if(message&&/^Opening/.test(message.textContent))message.textContent='Tap “Open Ghost Speak” to start learning. Your progress stays in this browser.';
if(link)link.focus();
},1200);
</script>
</body>
</html>
