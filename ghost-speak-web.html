<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">

<title>Ghost Speak</title>
<style>
:root{--bg:#16141c;--card:#23202c;--card2:#2d2938;--line:#3d3650;--text:#f4f1fa;--muted:#c2bbd2;--violet:#9b7cf6;--lav:#d2c4ff;--mint:#5fd4a8;--wrong:#ff8a9a;--gold:#ffd27a;--radius:20px;--tap:48px}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
body{background:radial-gradient(900px 500px at 50% -10%,#3a2f63 0%,transparent 60%),var(--bg);padding:env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left)}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible{outline:3px solid var(--lav);outline-offset:3px;border-radius:12px}
button:disabled{cursor:default}
.app{max-width:520px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column;padding:16px 18px 220px}
.top{display:flex;align-items:center;min-height:44px}
.bar{flex:1;height:14px;background:var(--card2);border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--mint),#8fe8c8);border-radius:99px;transition:width .5s cubic-bezier(.2,.8,.2,1)}

.ghost.thinking{animation:wobble .6s ease-in-out infinite}
.ghost.celebrate{animation:hop .6s cubic-bezier(.2,.9,.3,1.3) 2}
.ghost.sad{animation:droop 1.2s ease 1}
.ghost.small{width:64px;height:64px;margin:0}
h1{font-size:28px;line-height:1.2;margin:8px 0 6px;font-weight:800}
p{margin:0 0 12px;color:var(--muted);line-height:1.5;font-size:17px}
.center{text-align:center}
.screen{animation:fadeUp .35s ease both}
.tag{display:inline-block;font-size:14px;font-weight:700;letter-spacing:.03em;color:var(--lav);background:rgba(155,124,246,.2);padding:6px 12px;border-radius:99px;margin-top:8px}
.prompt{font-size:23px;font-weight:700;line-height:1.35;color:var(--text);margin:14px 0 18px}
.choices{display:grid;gap:12px}
.choice{min-height:var(--tap);padding:14px 16px;border-radius:16px;background:var(--card2);border:2px solid var(--line);text-align:left;font-size:18px;font-weight:600;color:var(--text);transition:transform .15s ease,background .2s,border-color .2s;display:flex;align-items:center;gap:12px}

.choice:active:not(:disabled){transform:scale(.98)}
.choice .key{flex:0 0 auto;display:inline-grid;place-items:center;width:30px;height:30px;border-radius:8px;background:var(--bg);color:var(--lav);font-size:15px;font-weight:700}

.feedback .why{color:var(--text);margin:0;font-size:16px}
.btn{display:block;width:100%;min-height:var(--tap);padding:14px 18px;border-radius:16px;font-weight:800;font-size:18px;background:linear-gradient(180deg,#b79cff,var(--violet));color:#1a1430;box-shadow:0 5px 0 #6a4fc4;margin-top:12px;transition:transform .1s,box-shadow .1s}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 #6a4fc4}
.btn.ghostly{background:var(--card2);color:var(--lav);box-shadow:none;border:2px solid var(--line)}
.btn.mint{background:linear-gradient(180deg,#8fe8c8,var(--mint));box-shadow:0 5px 0 #3a9c7a;color:#0f2a20}

.nav{position:fixed;left:0;right:0;bottom:0;display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-width:520px;margin:0 auto;padding:10px 18px calc(10px + env(safe-area-inset-bottom));background:var(--bg);border-top:1px solid var(--line);z-index:4}
.nav button{min-height:var(--tap);border-radius:14px;color:var(--muted);font-weight:600;font-size:15px}
.nav button[aria-current="page"]{color:var(--text);background:var(--card2)}
.path{display:grid;gap:12px;margin-top:10px}
.node{display:flex;align-items:center;gap:14px;padding:14px;border-radius:18px;background:var(--card);min-height:var(--tap);text-align:left;width:100%}
.node .dot{flex:0 0 auto;width:52px;height:52px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:18px;background:var(--card2);border:3px solid var(--line)}
.node.done .dot{background:var(--mint);border-color:var(--mint);color:#0f2a20}
.node.now .dot{background:var(--violet);border-color:var(--lav);color:#1a1430;animation:glow 1.6s ease-in-out infinite}

.node small{color:var(--muted);font-size:14px}
.stat{display:flex;justify-content:space-between;gap:12px;padding:14px 0;border-bottom:1px solid var(--line);font-size:17px}
.stat b{color:var(--lav)}
.card{background:var(--card);border-radius:var(--radius);padding:18px;margin:12px 0}
.stars{color:var(--gold);letter-spacing:4px;font-size:22px}
.notice{border-left:4px solid var(--wrong);background:#3d2530;color:#ffd7dd;padding:14px;border-radius:12px;margin:12px 0;font-size:16px}
.spark{position:fixed;width:10px;height:10px;border-radius:3px;pointer-events:none;z-index:9;animation:fall 1.1s ease-out forwards}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes wobble{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
@keyframes hop{0%,100%{transform:translateY(0)}40%{transform:translateY(-18px)}70%{transform:translateY(0)}}
@keyframes droop{0%{transform:translateY(0)}50%{transform:translateY(6px) rotate(-6deg)}100%{transform:translateY(0)}}
@keyframes glow{0%,100%{box-shadow:0 0 0 0 rgba(155,124,246,.6)}50%{box-shadow:0 0 0 10px rgba(155,124,246,0)}}
@keyframes pop{0%{transform:scale(.96)}60%{transform:scale(1.03)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes fall{0%{opacity:1;transform:translate(0,0) rotate(0)}100%{opacity:0;transform:translate(var(--dx),var(--dy)) rotate(360deg)}}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}.spark{display:none}}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="bar" role="progressbar" aria-label="Lesson progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="barWrap"><i id="bar"></i></div>
  </header>
  <main id="main" class="screen" tabindex="-1"></main>
</div>
<nav class="nav" aria-label="Main">
  <button type="button" data-go="learn">Learn</button>
  <button type="button" data-go="review">Review</button>
  <button type="button" data-go="progress">Progress</button>
</nav>
<div class="feedback" id="feedback" role="status" aria-live="polite">
  <p class="title" id="fbTitle"></p>
  <p class="why" id="fbWhy"></p>
  <button type="button" class="btn" id="fbNext">Continue</button>
</div>
<div class="sr" id="announcer" aria-live="assertive"></div>

<script type="module">
// ===== Domain logic (pure and testable) =====
export const SCHEMA = 1;
export const KEY = "ghost-speak-v1";

// Deterministic PRNG: the same seed always gives the same option order.
export function makeRng(seed) {
  let s = seed >>> 0;
  return () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; };
}
export function shuffle(arr, rng) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rng() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}
// A 4-choice question: the correct answer plus three distractors, in a fixed order for this seed.
export function buildQuestion(item, distractors, rng) {
  if (!Array.isArray(distractors) || distractors.length !== 3) throw new Error("Need exactly 3 distractors for " + item.id);
  const options = shuffle([item.answer, ...distractors], rng);
  return { id: item.id, prompt: item.prompt, options, correctIndex: options.indexOf(item.answer), answer: item.answer };
}
export function grade(question, chosenIndex) {
  if (!Number.isInteger(chosenIndex) || chosenIndex < 0 || chosenIndex >= question.options.length) throw new Error("Invalid choice");
  return chosenIndex === question.correctIndex;
}
export function stars(pct) { return pct >= 90 ? 3 : pct >= 70 ? 2 : pct >= 50 ? 1 : 0; }
export function lessonSummary(answers) {
  const correct = answers.filter(Boolean).length;
  const pct = answers.length ? Math.round((correct / answers.length) * 100) : 0;
  return { correct, total: answers.length, pct, stars: stars(pct) };
}
export function freshState() { return { schema: SCHEMA, lessons: {}, xp: 0 }; }
// Returns {state} or {error, raw}. A bad save is kept, never deleted.
export function loadState(storage) {
  let raw;
  try { raw = storage.getItem(KEY); } catch { return { error: "unavailable" }; }
  if (!raw) return { state: freshState() };
  let data;
  try { data = JSON.parse(raw); } catch { return { error: "corrupt", raw }; }
  if (!data || data.schema !== SCHEMA) return { error: "unknown-schema", raw };
  return { state: data };
}
// Writes, then reads back to verify. Throws if the write did not stick (quota, private mode).
export function saveState(storage, state) {
  const json = JSON.stringify({ ...state, schema: SCHEMA });
  storage.setItem(KEY, json);
  const back = JSON.parse(storage.getItem(KEY));
  if (!back || back.schema !== SCHEMA) throw new Error("the save could not be verified");
  return back;
}

// ===== Content =====
export const LESSONS = [
  { id: "greetings", title: "Greetings", items: [
    { id: "g1", prompt: "A neighbour says 'Good morning!'. You reply:", answer: "Good morning, how are you?", wrong: ["Goodbye, see you", "Thank you very much", "Good night, sleep well"] },
    { id: "g2", prompt: "You meet someone for the first time. Best opener:", answer: "Nice to meet you", wrong: ["Nice to see you again", "How old are you?", "Where are you from?"] },
    { id: "g3", prompt: "Saying goodbye at night:", answer: "Good night", wrong: ["Good morning", "Good afternoon", "Good luck with that"] },
    { id: "g4", prompt: "A polite way to ask someone's name:", answer: "May I ask your name?", wrong: ["What is your name?", "Name me, please", "I know your name"] },
    { id: "g5", prompt: "Replying to 'Thank you':", answer: "You're welcome", wrong: ["You're very welcome, sorry", "Thank you", "Yes, you're right"] },
  ]},
  { id: "ordering", title: "Ordering food", items: [
    { id: "o1", prompt: "You want a coffee. Choose the polite sentence:", answer: "I'd like a coffee, please", wrong: ["I like coffee", "Give me coffee now", "Coffee am I"] },
    { id: "o2", prompt: "The waiter asks what you want to drink:", answer: "Just water, thanks", wrong: ["Just water, sorry", "Water is good", "I want the water now"] },
    { id: "o3", prompt: "You want the bill:", answer: "Could we have the bill, please?", wrong: ["Bill me now", "I want to bill", "Where is the bill from"] },
    { id: "o4", prompt: "You need a fork:", answer: "Could I get a fork, please?", wrong: ["I no fork", "Fork is there", "Give fork me"] },
    { id: "o5", prompt: "You didn't understand the question:", answer: "Sorry, could you repeat that?", wrong: ["Sorry, I don't understand you", "Repeat please, bye", "I understand everything"] },
  ]},
  { id: "time", title: "Talking about time", items: [
    { id: "t1", prompt: "'I will call you ___.' (the day after today)", answer: "tomorrow", wrong: ["yesterday", "last week", "tomorrow morning later"] },
    { id: "t2", prompt: "Past tense of 'go':", answer: "went", wrong: ["goed", "gone yesterday", "going"] },
    { id: "t3", prompt: "Something that happened last week:", answer: "I went to the park last week", wrong: ["I go to the park last week", "I will went to the park", "I going to the park"] },
    { id: "t4", prompt: "Choose the right form: 'She ___ to work every day.'", answer: "goes", wrong: ["go", "going", "gone"] },
    { id: "t5", prompt: "A plan for later this year:", answer: "I'm going to study in the autumn", wrong: ["I went to study last year", "I studied in the autumn", "I'm study in the autumn"] },
  ]},
  { id: "small-talk", title: "Small talk", items: [
    { id: "s1", prompt: "Someone asks 'How are you?' A natural reply:", answer: "I'm doing well, thanks. And you?", wrong: ["I am well-doing, thank", "Yes, I am you", "I are fine, you"] },
    { id: "s2", prompt: "Ending a conversation politely:", answer: "It was lovely talking to you", wrong: ["It was lovely talk you", "Stop talking now", "Bye, never again"] },
    { id: "s3", prompt: "Asking about someone's weekend:", answer: "Did you do anything nice at the weekend?", wrong: ["Did you nice anything weekend?", "Do you weekend go nice?", "Weekend is nice for you did?"] },
    { id: "s4", prompt: "Someone compliments your jacket. Reply:", answer: "Thank you, I like it too", wrong: ["Thanks, you jacket", "Jacket is thank you", "I like you jacket"] },
    { id: "s5", prompt: "You want to agree with an idea:", answer: "I completely agree", wrong: ["I completely agreed me", "I agree complete", "I am agree it"] },
    { id: "s6", prompt: "A friend tells you good news. Reply:", answer: "That's wonderful news!", wrong: ["That's wonder news!", "News wonderful is that!", "Wonderful is news I"] },
    { id: "s7", prompt: "Politely interrupting someone:", answer: "Sorry to interrupt, but may I add something?", wrong: ["Sorry interrupt, add I something", "Shut up, I want to add", "Stop, I speak now"] },
    { id: "s8", prompt: "Asking how long someone has lived here:", answer: "How long have you lived here?", wrong: ["How long you have lived here?", "How long do you living here?", "How long are you live here since?"] },
    { id: "s9", prompt: "Showing interest in someone's hobbies:", answer: "What do you do in your free time?", wrong: ["What you do in free time?", "What free time you do?", "Do you what free time?"] },
    { id: "s10", prompt: "Saying you are not certain:", answer: "I'm not sure, to be honest", wrong: ["I no sure, to be honest", "I not sure be honest", "Not I sure, honest be"] },
    { id: "s11", prompt: "Offering to help someone:", answer: "Can I help you with that?", wrong: ["Can I help with you that?", "Help me you that can?", "I can help that you"] },
    { id: "s12", prompt: "Ending a phone call warmly:", answer: "Let's speak again soon", wrong: ["Let us speak again soonly", "Let's talk soon at I", "I let speak again"] },
  ]},
  { id: "directions", title: "Asking the way", items: [
    { id: "d1", prompt: "Asking where the station is:", answer: "Excuse me, where is the station?", wrong: ["Excuse me, station where is?", "Where station is excuse me?", "Excuse, the station where"] },
    { id: "d2", prompt: "Telling someone to turn at the lights:", answer: "Turn right at the traffic lights", wrong: ["Turn right on traffic light ago", "Right turn lights are traffic at", "Go right, then the lights"] },
    { id: "d3", prompt: "Asking if a shop is far away:", answer: "Is it far from here?", wrong: ["Is far it from here?", "It is far from here?", "Far is it here from?"] },
    { id: "d4", prompt: "Meaning of 'next to':", answer: "beside", wrong: ["behind", "between", "across from it"] },
    { id: "d5", prompt: "Meaning of 'in front of':", answer: "in front of", wrong: ["behind", "under", "far from"] },
    { id: "d6", prompt: "You are lost. Ask for help:", answer: "Sorry, I'm lost. Could you help me?", wrong: ["Sorry, I lost. Help me?", "I'm lost, you help", "Help me lost, sorry you"] },
    { id: "d7", prompt: "Asking how far it is on foot:", answer: "How far is it on foot?", wrong: ["How far is it by foot on?", "How far walking it is?", "How is far foot it?"] },
    { id: "d8", prompt: "Thanking someone for directions:", answer: "Thanks, you've been very helpful", wrong: ["Thanks, you very helpful been", "Thanks, you are help been", "Thanks, helpful you was"] },
    { id: "d9", prompt: "Meaning of 'route':", answer: "the way you travel from A to B", wrong: ["a kind of map picture", "a type of car", "a small road sign"] },
    { id: "d10", prompt: "Crossing the road safely: 'Look ___ before you cross.'", answer: "both ways", wrong: ["both way's", "the way both", "way both"] },
    { id: "d11", prompt: "Asking for the nearest bus stop:", answer: "Where is the nearest bus stop?", wrong: ["Where is nearest bus stop?", "Nearest where bus stop is?", "Where bus stop is the nearest?"] },
    { id: "d12", prompt: "Confirming you understood the directions:", answer: "Got it, I'll go straight on", wrong: ["Got it, I go straight on yesterday", "Got it, I goed straight", "Got, I straight on going"] },
  ]},
];
// Content check: unique ids, exactly 3 distinct wrong answers, none equal to the correct one.
export function validateContent(lessons) {
  const errors = [];
  const ids = new Set();
  for (const l of lessons) for (const it of l.items) {
    if (ids.has(it.id)) errors.push("duplicate id " + it.id);
    ids.add(it.id);
    if (!Array.isArray(it.wrong) || it.wrong.length !== 3) errors.push(it.id + " needs exactly 3 wrong answers");
    else {
      if (it.wrong.includes(it.answer)) errors.push(it.id + " has the correct answer among the wrong ones");
      if (new Set(it.wrong).size !== 3) errors.push(it.id + " has duplicate wrong answers");
    }
  }
  return errors;
}
// Builds the question list for one lesson with a seed from its id (stable across reloads).
export function buildLessonQuestions(lesson) {
  let seed = 0;
  for (const ch of lesson.id) seed = (seed * 31 + ch.charCodeAt(0)) >>> 0;
  const rng = makeRng(seed);
  return lesson.items.map(it => buildQuestion(it, it.wrong, rng));
}

// ===== UI =====
const $ = (s) => document.querySelector(s);
const main = $("#main");
const fb = $("#feedback");
const bar = $("#bar");
const barWrap = $("#barWrap");
const announcer = $("#announcer");
const reduceMotion = () => matchMedia("(prefers-reduced-motion: reduce)").matches;

let storage;
try { storage = window.localStorage; } catch { storage = null; }
let stateRes = storage ? loadState(storage) : { error: "unavailable" };
let state = stateRes.state || freshState();
let session = null; // {lesson, questions, i, answers, locked}
let current = "learn";
let saveWarning = "";

function say(msg) { announcer.textContent = ""; setTimeout(() => { announcer.textContent = msg; }, 30); }
function setProgress(pct) { bar.style.width = pct + "%"; barWrap.setAttribute("aria-valuenow", String(Math.round(pct))); }
function ghostSvg(mode = "", cls = "") {
  return `<svg class="ghost ${mode} ${cls}" viewBox="0 0 120 120" aria-hidden="true" focusable="false">
  <defs><linearGradient id="gg${cls}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#cdbbff"/></linearGradient></defs>
  <path d="M20 58 C20 28 40 14 60 14 C80 14 100 28 100 58 L100 102 L92 94 L84 104 L76 94 L68 104 L60 94 L52 104 L44 94 L36 104 L28 94 L20 102 Z" fill="url(#gg${cls})"/>
  <ellipse cx="46" cy="54" rx="6" ry="7" fill="#2a2140"/><ellipse cx="74" cy="54" rx="6" ry="7" fill="#2a2140"/>
  <circle cx="48" cy="52" r="2" fill="#fff"/><circle cx="76" cy="52" r="2" fill="#fff"/>
  <ellipse cx="38" cy="68" rx="5" ry="3" fill="#ffb3c7" opacity=".7"/><ellipse cx="82" cy="68" rx="5" ry="3" fill="#ffb3c7" opacity=".7"/>
  <path d="M52 70 Q60 78 68 70" stroke="#2a2140" stroke-width="3" fill="none" stroke-linecap="round"/>
</svg>`;
}
function confetti() {
  if (reduceMotion()) return;
  const colors = ["#9b7cf6", "#5fd4a8", "#ffd27a", "#c9b8ff"];
  for (let i = 0; i < 28; i++) {
    const s = document.createElement("span");
    s.className = "spark";
    s.style.left = Math.random() * 100 + "vw";
    s.style.top = "40vh";
    s.style.background = colors[i % colors.length];
    s.style.setProperty("--dx", (Math.random() * 200 - 100) + "px");
    s.style.setProperty("--dy", (Math.random() * 300 + 80) + "px");
    document.body.appendChild(s);
    setTimeout(() => s.remove(), 1200);
  }
}
function persist() {
  try {
    state = saveState(storage, state);
    saveWarning = "";
    return true;
  } catch (e) {
    saveWarning = "Progress could not be saved (" + e.message + "). Your last saved progress is still kept. Free up browser storage, then try again.";
    return false;
  }
}
function showStorageNotice() {
  if (!stateRes.error) return "";
  const msg = stateRes.error === "corrupt"
    ? "Your saved progress could not be read. It was kept, not deleted, so nothing is lost."
    : stateRes.error === "unknown-schema"
      ? "Your saved progress is from a newer version of this app. It was kept, not deleted."
      : "Browser storage is turned off or blocked, so progress will not be saved in this window.";
  return `<div class="notice" role="alert">${msg}</div>`;
}
function setNav(view) {
  document.querySelectorAll(".nav [data-go]").forEach(b => b.setAttribute("aria-current", b.dataset.go === view ? "page" : "false"));
}
function go(view) {
  current = view;
  hideFeedback();
  session = null;
  setNav(view);
  if (view === "learn") renderLearn();
  else if (view === "review") renderReview();
  else renderProgress();
  main.focus({ preventScroll: true });
}
function hideFeedback() { fb.classList.remove("show", "ok", "bad"); }
function lessonDone(id) { return !!(state.lessons[id] && state.lessons[id].done); }
function unlocked(index) { return index === 0 || lessonDone(LESSONS[index - 1].id); }

function renderLearn() {
  setProgress(0);
  const cards = LESSONS.map((l, i) => {
    const r = state.lessons[l.id];
    const done = lessonDone(l.id);
    const open = unlocked(i);
    const cls = done ? "done" : open ? "now" : "locked";
    const label = done ? "✓" : String(i + 1);
    const status = done
      ? `<span class="stars" aria-label="${r.stars} of 3 stars">${"★".repeat(r.stars)}${"☆".repeat(3 - r.stars)}</span>`
      : open ? "Start" : "Locked: finish the lesson before this";
    const state_ = done ? "completed" : open ? "ready" : "locked";
    return `<button class="node ${cls}" type="button" data-lesson="${l.id}" ${open ? "" : "disabled"} aria-label="${l.title}, ${state_}">
      <span class="dot" aria-hidden="true">${label}</span><span><strong>${l.title}</strong><small>${l.items.length} questions · ${status}</small></span></button>`;
  }).join("");
  main.innerHTML = `${showStorageNotice()}
    <div class="center">${ghostSvg("idle")}<h1>Speak with confidence</h1>
    <p>Pick a lesson. Four answers each time, one right. Take your time.</p></div>
    ${saveWarning ? `<div class="notice" role="alert">${saveWarning}</div>` : ""}
    <div class="path">${cards}</div>`;
  main.querySelectorAll("[data-lesson]").forEach(b => b.addEventListener("click", () => startLesson(b.dataset.lesson)));
}

function startLesson(id) {
  const lesson = LESSONS.find(l => l.id === id);
  if (!lesson) return;
  session = { lesson, questions: buildLessonQuestions(lesson), i: 0, answers: [], locked: false };
  renderQuestion();
}

function renderQuestion() {
  const q = session.questions[session.i];
  const total = session.questions.length;
  setProgress((session.i / total) * 100);
  main.innerHTML = `<div class="top-row" style="display:flex;align-items:center;gap:12px">${ghostSvg("idle", "small")}<span class="tag">Question ${session.i + 1} of ${total}</span></div>
    <p class="prompt" id="prompt">${q.prompt}</p>
    <div class="choices" role="group" aria-labelledby="prompt">
      ${q.options.map((o, k) => `<button class="choice" type="button" data-k="${k}"><span class="key" aria-hidden="true">${k + 1}</span><span>${o}</span></button>`).join("")}
    </div>`;
  main.querySelectorAll(".choice").forEach(b => b.addEventListener("click", () => answer(Number(b.dataset.k))));
  hideFeedback();
  say(`Question ${session.i + 1} of ${total}`);
  main.focus({ preventScroll: true });
}

function answer(k) {
  if (!session || session.locked) return;
  session.locked = true;
  const q = session.questions[session.i];
  const ok = grade(q, k);
  session.answers.push(ok);
  main.querySelectorAll(".choice").forEach((b, idx) => {
    b.disabled = true;
    if (idx === q.correctIndex) b.classList.add("right");
    else if (idx === k) b.classList.add("wrong");
    else b.classList.add("dim");
  });
  const ghost = main.querySelector(".ghost");
  if (ghost) ghost.setAttribute("class", "ghost small " + (ok ? "celebrate" : "sad"));
  if (ok) confetti();
  fb.className = "feedback show " + (ok ? "ok" : "bad");
  $("#fbTitle").textContent = ok ? "Nice, that's right!" : "Not quite";
  $("#fbWhy").textContent = ok ? `"${q.answer}" fits this situation.` : `The correct answer is "${q.answer}".`;
  const last = session.i === session.questions.length - 1;
  const next = $("#fbNext");
  next.textContent = last ? "Finish lesson" : "Continue";
  next.onclick = () => {
    session.locked = false;
    if (last) finishLesson();
    else { session.i++; renderQuestion(); }
  };
  next.focus({ preventScroll: true });
  say(ok ? "Correct." : "Not quite. The correct answer is " + q.answer + ".");
}

function finishLesson() {
  hideFeedback();
  const sum = lessonSummary(session.answers);
  const id = session.lesson.id;
  state.lessons[id] = { done: true, stars: sum.stars, pct: sum.pct, at: new Date().toISOString() };
  state.xp = (state.xp || 0) + sum.correct * 10;
  const saved = persist(); // save BEFORE showing the result
  session = null;
  setProgress(100);
  main.innerHTML = `<div class="center screen">${ghostSvg("celebrate")}
    <h1>Lesson complete</h1>
    <p>You got ${sum.correct} of ${sum.total} right (${sum.pct}%).</p>
    <div class="stars" aria-label="${sum.stars} of 3 stars">${"★".repeat(sum.stars)}${"☆".repeat(3 - sum.stars)}</div>
    ${saved ? "" : `<div class="notice" role="alert">${saveWarning}</div>`}
    <button class="btn mint" type="button" id="again">Practise this lesson again</button>
    <button class="btn ghostly" type="button" id="back">Back to lessons</button></div>`;
  $("#again").onclick = () => startLesson(id);
  $("#back").onclick = () => go("learn");
  $("#again").focus({ preventScroll: true });
  say("Lesson complete. " + sum.correct + " of " + sum.total + " right.");
}

function renderReview() {
  setProgress(0);
  const weak = LESSONS.filter(l => lessonDone(l.id) && state.lessons[l.id].stars < 3);
  if (!weak.length) {
    main.innerHTML = `<h1>Review</h1><p>Finish a lesson, then come back here to practise any lesson you scored under 3 stars on.</p>`;
    return;
  }
  main.innerHTML = `<h1>Review</h1><p>Lessons you can improve:</p><div class="path">${weak.map(l => `<button class="node now" type="button" data-lesson="${l.id}"><span class="dot" aria-hidden="true">↺</span><span><strong>${l.title}</strong><small>Practise again</small></span></button>`).join("")}</div>`;
  main.querySelectorAll("[data-lesson]").forEach(b => b.addEventListener("click", () => startLesson(b.dataset.lesson)));
}

function renderProgress() {
  setProgress(0);
  const done = LESSONS.filter(l => lessonDone(l.id)).length;
  const totalStars = LESSONS.reduce((a, l) => a + (lessonDone(l.id) ? state.lessons[l.id].stars : 0), 0);
  main.innerHTML = `<h1>Your progress</h1>
    <div class="card">
      <div class="stat"><span>Lessons completed</span><b>${done} / ${LESSONS.length}</b></div>
      <div class="stat"><span>Stars earned</span><b>${totalStars}</b></div>
      <div class="stat"><span>XP</span><b>${state.xp || 0}</b></div>
    </div>
    <p>Progress is saved in this browser only.</p>`;
}

// ===== Boot =====
document.querySelectorAll(".nav [data-go]").forEach(b => b.addEventListener("click", () => go(b.dataset.go)));
const contentErrors = validateContent(LESSONS);
if (contentErrors.length) {
  main.innerHTML = `<div class="notice" role="alert">Lesson content error: ${contentErrors.join("; ")}</div>`;
} else {
  go("learn");
}
</script>
</body>
</html>
