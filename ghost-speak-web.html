{id:'hello',title:'A friendly hello',objective:'Greet someone and introduce yourself.',phrases:[['Hello!','¡Hola!','Hello! My name is Ana.'],['My name is Ana.','Me llamo Ana.','Hello! My name is Ana.'],['What is your name?','¿Cómo te llamas?','Hi! What is your name?'],['Good morning!','¡Buenos días!','Good morning! My name is Luis.'],['Hi!','¡Hola! (informal)','Hi! My name is Sam.'],['Goodbye!','¡Adiós!','Goodbye! See you tomorrow.']],order:'My name is Ana.',accepted:['My name is Ana.'],note:'Para presentarte, usa «My name is…». Para preguntar el nombre, di «What is your name?».',listen:'Hello! My name is Ana.'},
{id:'meet',title:'Nice to meet you',objective:'Meet a new classmate and respond politely.',phrases:[['Nice to meet you.','Mucho gusto.','Hi, Ana. Nice to meet you.'],['Nice to meet you too.','Igualmente.','Nice to meet you too, Luis.'],["I'm Ana.",'Soy Ana. (al presentarte)',"Hi! I'm Ana."],['This is Luis.','Este es Luis.','Ana, this is Luis.'],['Welcome!','¡Bienvenido/a!','Welcome! My name is Sam.'],['Thank you.','Gracias.','Thank you. Nice to meet you.']],order:'Nice to meet you too.',accepted:['Nice to meet you too.'],note:'«Nice to meet you» se usa al conocer a alguien. Añade «too» para responder «Igualmente».',listen:'Nice to meet you too.'},
{id:'origin',title:'Where are you from?',objective:'Ask about someone’s country and share yours.',phrases:[['Where are you from?','¿De dónde eres?','Hi! Where are you from?'],["I'm from Mexico.",'Soy de México.',"I'm from Mexico. And you?"],['And you?','¿Y tú?','My name is Ana. And you?'],['I live in Madrid.','Vivo en Madrid.','I live in Madrid now.'],['Are you from Spain?','¿Eres de España?','Are you from Spain, Luis?'],['Yes, I am.','Sí. (respuesta a «Are you…?»)','Are you from Spain? Yes, I am.']],order:"I'm from Mexico.",accepted:["I'm from Mexico.",'I am from Mexico.'],note:'Usa «from» para indicar tu origen y «live in» para decir dónde vives. «I’m» significa «I am».',listen:"I'm from Mexico. And you?"},
{id:'checkin',title:'How are you?',objective:'Ask how someone is and give a simple answer.',phrases:[['How are you?','¿Cómo estás?','Hi, Ana! How are you?'],["I'm fine, thank you.",'Estoy bien, gracias.',"I'm fine, thank you. And you?"],["I'm a little tired.",'Estoy un poco cansado/a.',"I'm a little tired today."],["I'm happy.",'Estoy contento/a.',"I'm happy to be here."],['Very well, thanks.','Muy bien, gracias.','How are you? Very well, thanks.'],['How about you?','¿Y tú? (para devolver la pregunta)',"I'm fine. How about you?"]],order:"I'm fine, thank you.",accepted:["I'm fine, thank you.",'I am fine, thank you.'],note:'«How are you?» pregunta cómo estás. Puedes responder «I’m fine, thank you» y devolver la pregunta con «And you?».',listen:"I'm a little tired."},

];
const choice=(id,prompt,values,key,explanation)=>({id,kind:'choice',prompt,options:values.map((text,i)=>({id:'c'+i,text})),answer:'c'+key,explanation});
function makeExercises(l){const p=l.phrases,ex=l.note,tokens=l.order.split(' ').map((text,i)=>({id:'t'+i,text}));return [choice(l.id+'-greet',`Which English phrase means “${p[0][1]}”?`,[p[2][0],p[0][0],p[4][0]],1,ex),choice(l.id+'-meaning',`What does “${p[1][0]}” mean?`,[p[1][1],p[3][1],p[5][1]],0,ex),{id:l.id+'-order',kind:'order',prompt:'Build the phrase: '+(l.id==='hello'?p[1][1]:l.id==='meet'?p[1][1]:l.id==='origin'?p[1][1]:l.id==='checkin'?p[1][1]:p[0][1]),tokens:[...tokens].reverse(),answer:tokens.map(t=>t.id),explanation:ex},{id:l.id+'-match',kind:'match',prompt:'Match each English phrase to its Spanish meaning.',pairs:p.slice(0,3).map((v,i)=>({id:'m'+i,en:v[0],es:v[1]})),explanation:ex},{id:l.id+'-write',kind:'text',prompt:'Write in English: '+(l.id==='bye'?p[0][1]:p[1][1]),accepted:l.accepted,explanation:ex},{id:l.id+'-listen',kind:'listen',prompt:'Listen, or read the transcript. Which phrase is included?',say:l.listen,options:[{id:'c0',text:p[4][0]},{id:'c1',text:p[3][0]},{id:'c2',text:l.id==='hello'?p[1][0]:l.id==='meet'?p[1][0]:l.id==='origin'?p[1][0]:l.id==='checkin'?p[2][0]:p[2][0]}],answer:'c2',explanation:ex},choice(l.id+'-recall',`Choose the English for “${p[5][1]}”.`,[p[3][0],p[0][0],p[5][0]],2,ex),{id:l.id+'-final',kind:'text',prompt:'Finish with this useful phrase in English: '+p[0][1],accepted:[p[0][0]],explanation:ex}];}

const VOCAB=COURSES.flatMap(l=>l.phrases.map((p,i)=>({id:l.id+'-v'+i,lesson:l.id,en:p[0],es:p[1],example:p[2]})));
const SCENARIOS=[{id:'classmate',title:'A new classmate',icon:'✦',role:'A classmate on your first day',goal:'Greet someone, introduce yourself, ask their name, and say goodbye.',steps:[['Your classmate smiles and says “Hello!” Greet them.','Hello!'],['Introduce yourself. Use your own name.','My name is Ana.'],['Ask for their name.','What is your name?'],['Your classmate says “My name is Luis.” End politely.','Nice to meet you, Luis. Goodbye!']]},{id:'cafe',title:'Before class',icon:'☕',role:'A fellow learner waiting at a café',goal:'Introduce yourself, share your country, ask how they are, and close the conversation.',steps:[['Say hello and share your name.',"Hi! I'm Ana."],['Say where you are from.',"I'm from Mexico."],['Ask how the other learner is.','How are you?'],['They say “Very well, thanks.” Say you will see them tomorrow.','See you tomorrow.']]},{id:'neighbor',title:'Meet a neighbor',icon:'⌂',role:'A new neighbor in your building',goal:'Welcome someone and practice a friendly first exchange.',steps:[['Welcome your neighbor.','Welcome!'],['Introduce yourself and ask their name.','My name is Ana. What is your name?'],['They say “I’m Sam. Nice to meet you.” Respond.','Nice to meet you too.'],['Wish them a good day.','Have a nice day!']]}];
function uid(){return globalThis.crypto?.randomUUID?.()||Date.now().toString(36)+'-'+Math.random().toString(36).slice(2);}
function normalize(s){return String(s).normalize('NFC').toLocaleLowerCase('en').replace(/[’‘]/g,"'").replace(/[.,!?¿¡]/g,'').replace(/\s+/g,' ').trim();}
function grade(e,d){if(e.kind==='text')return e.accepted.some(a=>normalize(a)===normalize(d.text||''));if(e.kind==='listen'&&d.text?.trim())return normalize(d.text)===normalize(e.say);if(e.kind==='order')return Array.isArray(d.order)&&d.order.length===e.answer.length&&d.order.every((x,i)=>x===e.answer[i]);if(e.kind==='match')return e.pairs.every(p=>d.match?.[p.id]===p.id);return d.choice===e.answer;}
function emptyDraft(){return {text:'',choice:'',order:[],match:{},transcript:false};}
function answerText(e){return e.kind==='text'?e.accepted[0]:e.kind==='order'?e.answer.map(id=>e.tokens.find(t=>t.id===id).text).join(' '):e.kind==='match'?e.pairs.map(p=>p.en+' → '+p.es).join(' · '):e.options.find(o=>o.id===e.answer).text;}
function dayParts(t,zone){return Object.fromEntries(new Intl.DateTimeFormat('en-CA',{timeZone:zone,year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit',hourCycle:'h23'}).formatToParts(new Date(t)).filter(p=>p.type!=='literal').map(p=>[p.type,Number(p.value)]));}
function dayKey(t,zone){const p=dayParts(t,zone);return `${p.year}-${String(p.month).padStart(2,'0')}-${String(p.day).padStart(2,'0')}`;}
function wallTime(y,m,d,h,zone){const target=Date.UTC(y,m-1,d,h);let guess=target;for(let i=0;i<5;i++){const p=dayParts(guess,zone),wall=Date.UTC(p.year,p.month-1,p.day,p.hour,p.minute,p.second),delta=target-wall;if(!delta)return guess;guess+=delta;}return guess;}
function calendarDue(now,days,zone){const p=dayParts(now,zone),date=new Date(Date.UTC(p.year,p.month-1,p.day+days,12));return wallTime(date.getUTCFullYear(),date.getUTCMonth()+1,date.getUTCDate(),12,zone);}
function schedule(w,rating,now,zone){if(!['Again','Hard','Good','Easy'].includes(rating))throw Error('Unknown rating');if(!Number.isFinite(now)||!Number.isInteger(w.interval)||w.interval<0||w.interval>180||!Array.isArray(w.successDays))throw Error('Invalid review state');dayKey(now,zone);const fresh=!w.interval||w.relearning;let interval=0;if(rating==='Hard')interval=fresh?1:Math.max(1,Math.round(w.interval*1.2));if(rating==='Good')interval=fresh?1:Math.max(2,Math.round(w.interval*2));if(rating==='Easy')interval=fresh?3:Math.max(3,Math.round(w.interval*3));interval=Math.min(180,interval);const successDays=rating==='Again'?[]:[...new Set([...(w.successDays||[]),dayKey(now,zone)])];return {...w,interval,relearning:rating==='Again',due:rating==='Again'?now+600000:calendarDue(now,interval,zone),successDays,mastered:rating!=='Again'&&successDays.length>=3&&interval>=14};}
function stars(correct,total){if(!Number.isInteger(total)||total<0||!Number.isInteger(correct)||correct<0||correct>total)throw Error('Invalid score');return !total?0:correct/total>=.9?3:correct/total>=.7?2:1;}
function unlocked(s,l){return l.prerequisites.every(id=>s.attempts.some(a=>a.lesson===id&&a.completedAt));}
function summary(a){const first=a.answers.filter(x=>typeof x?.firstCorrect==='boolean');return {correct:first.filter(x=>x.firstCorrect).length,total:first.length,stars:stars(first.filter(x=>x.firstCorrect).length,first.length)};}
function fresh(){return {version:2,contentVersion:CONTENT_VERSION,onboarded:false,prefs:{native:'es',explanation:'es',target:'en',locale:'en-US',level:'beginner',goal:5,zone:Intl.DateTimeFormat().resolvedOptions().timeZone||'UTC'},active:null,attempts:[],words:{},reviews:[],practice:{},intervals:[],playbacks:[]};}
function newAttempt(lesson){return {id:uid(),lesson,contentVersion:CONTENT_VERSION,index:0,draft:emptyDraft(),answers:[],startedAt:Date.now(),completedAt:null};}
function addWords(s,l,now){VOCAB.filter(v=>v.lesson===l.id).forEach(v=>{if(!s.words[v.id])s.words[v.id]={id:v.id,due:now,interval:0,relearning:false,successDays:[],mastered:false};});}
function completeAttempt(s,id,now){const a=s.attempts.find(x=>x.id===id);if(!a||a.completedAt)return false;const l=COURSES.find(l=>l.id===a.lesson);if(a.index!==l.exercises.length||!l.exercises.every((e,i)=>a.answers[i]?.correct))throw Error('Finish every exercise first.');a.completedAt=now;addWords(s,l,now);return true;}
function applyReview(s,id,rating,token,now){const w=s.words[id];if(!w||w.due>now||token!==id+':'+w.due||s.reviews.some(e=>e.id===token))return false;const next=schedule(w,rating,now,s.prefs.zone);s.words[id]=next;s.reviews.push({id:token,word:id,rating,at:now,interval:next.interval});return true;}

function renderWords(){const now=Date.now(),due=Object.values(state.words).filter(w=>w.due<=now).sort((a,b)=>a.due-b.due);let w=reviewID?state.words[reviewID]:null;if(!w||w.due>now){w=due[0];reviewID=w?.id||null;revealed=false;}const v=w&&VOCAB.find(v=>v.id===w.id);$('#main').innerHTML=`<div class="eyebrow">Little phrases, lasting confidence</div><h1>Words to keep.</h1><p class="muted">Phrases from completed lessons. Reveal a meaning, then honestly rate your recall.</p><section class="card featured"><div class="row"><h2>Your next review</h2><span class="pill good">${due.length} due</span></div>${v?`<p class="question">${esc(v.en)}</p><button data-play="${esc(v.en)}" class="quiet">▷ Listen</button>${revealed?`<div class="feedback"><p lang="es"><strong>${esc(v.es)}</strong></p><p>${esc(v.example)}</p></div><p class="tiny muted">How well did you remember?</p><div class="rating">${['Again','Hard','Good','Easy'].map(r=>`<button data-rating="${r}">${r}<span class="tiny muted">${r==='Again'?'10 min':schedule(w,r,now,state.prefs.zone).interval+' day(s)'}</span></button>`).join('')}</div>`:'<div class="actions"><button id="revealWord" class="primary">Reveal meaning</button></div>'}`:`<div class="empty">${mascot('celebrate',true)}<h3>${Object.keys(state.words).length?'All caught up.':'Your collection starts here.'}</h3><p class="muted">${Object.keys(state.words).length?'Your next due phrase will appear here. You can still browse your collection below.':'Finish a lesson to save its six phrases for review.'}</p><button id="wordsLearn" class="primary">Go to lessons</button></div>`}</section><section class="section"><h2>Your collection <span class="pill">${Object.keys(state.words).length} saved</span></h2><label for="wordSearch">Search English or Spanish</label><input class="input" id="wordSearch" type="search" value="${esc(search)}" placeholder="Try “hello” or “hola”"><label for="wordFilter">Filter phrases</label><select id="wordFilter">${[['all','All saved'],['due','Due now'],['learning','Learning'],['mastered','Mastered']].map(([id,t])=>`<option value="${id}" ${wordFilter===id?'selected':''}>${t}</option>`).join('')}</select><div id="wordResults" class="card"></div></section><details><summary>How review scheduling works</summary><p class="tiny muted">Again returns in 10 minutes. New or relearning words: Hard and Good return in 1 day; Easy in 3 days. Later reviews multiply the interval by 1.2, 2, or 3, capped at 180 days. Calendar reviews are scheduled for noon in your saved time zone. Mastered means recall on at least three distinct dates and an interval of at least 14 days. Again clears that status. No proficiency score is inferred.</p></details>`;if($('#revealWord'))$('#revealWord').onclick=()=>{revealed=true;renderWords();};if($('#wordsLearn'))$('#wordsLearn').onclick=()=>route('learn');document.querySelectorAll('[data-rating]').forEach(b=>{const token=w.id+':'+w.due;b.onclick=()=>{let applied=false;if(change(s=>{applied=applyReview(s,w.id,b.dataset.rating,token,Date.now());})&&applied){reviewID=null;revealed=false;renderWords();toast('Review saved.');}};});$('#wordSearch').oninput=e=>{search=e.target.value;renderWordResults();};$('#wordFilter').onchange=e=>{wordFilter=e.target.value;renderWordResults();};renderWordResults();bindAudio();}
function renderWordResults(){const list=VOCAB.filter(v=>{const w=state.words[v.id];return w&&normalize(v.en+' '+v.es).includes(normalize(search))&&(wordFilter==='all'||wordFilter==='due'&&w.due<=Date.now()||wordFilter==='mastered'&&w.mastered||wordFilter==='learning'&&!w.mastered);});$('#wordResults').innerHTML=list.length?list.map(v=>{const w=state.words[v.id];return `<article class="word"><div class="row"><h3>${esc(v.en)}</h3><span class="pill ${w.mastered?'good':''}">${w.mastered?'Mastered':w.due<=Date.now()?'Due':'Learning'}</span></div><p lang="es" class="muted">${esc(v.es)}</p><p class="tiny">${esc(v.example)}</p><p class="tiny muted">Next review: ${esc(new Date(w.due).toLocaleString(undefined,{timeZone:state.prefs.zone}))}</p></article>`;}).join(''):'<p class="empty muted">No matching phrases. Try another search or complete a lesson.</p>';}
function practiceSession(){const p=state.practice[practiceID];return p?.sessions.at(-1);}
function renderPractice(){const sc=SCENARIOS.find(s=>s.id===practiceID);if(!sc){$('#main').innerHTML=`<div class="hero"><div><div class="eyebrow">A safe space to try</div><h1>Small talk.<br><span class="accent">Real practice.</span></h1><p class="muted">Try useful phrases in three short, guided scenarios.</p></div>${mascot('',true)}</div><div class="card"><strong>Guided practice, not AI</strong><p class="muted">These are authored prompts and examples. Your replies are not automatically graded. Compare with the example and reflect. No microphone or speech recognition is used; type instead.</p></div>${SCENARIOS.map(s=>`<section class="card"><div class="row"><h2>${s.icon} ${s.title}</h2><span class="pill">4 turns</span></div><p class="muted">${esc(s.goal)}</p><button data-scenario="${s.id}" class="primary">${state.practice[s.id]?.sessions.at(-1)&&!state.practice[s.id].sessions.at(-1).completedAt?'Resume':'Practice'} ↗</button></section>`).join('')}`;document.querySelectorAll('[data-scenario]').forEach(b=>b.onclick=()=>{const id=b.dataset.scenario;if(change(s=>{s.practice[id]??={sessions:[]};const last=s.practice[id].sessions.at(-1);if(!last||last.completedAt)s.practice[id].sessions.push({id:uid(),startedAt:Date.now(),completedAt:null,replies:[],draft:''});})){practiceID=id;renderPractice();$('#main').focus();}});return;}const session=practiceSession(),step=session.replies.length;$('#main').innerHTML=`<button class="quiet" id="practiceBack">← All scenarios</button><div class="cluster section">${mascot(session.completedAt?'celebrate':playing?'listening':'',true)}<div><div class="eyebrow">Authored guided practice · Not AI</div><h1 class="question" style="margin:8px 0">${esc(sc.title)}</h1></div></div><p class="muted">${esc(sc.role)}. ${esc(sc.goal)}</p><progress value="${step}" max="4" aria-label="Practice replies completed"></progress>${session.replies.map((r,i)=>`<div class="bubble"><span class="eyebrow">Prompt ${i+1}</span><p>${esc(sc.steps[i][0])}</p></div><div class="bubble you"><span class="eyebrow">You</span><p>${esc(r)}</p></div><details><summary>Compare with one possible reply</summary><p>${esc(sc.steps[i][1])}</p><p class="tiny muted">Your wording can differ. This example does not validate your answer.</p></details>`).join('')}${session.completedAt?`<div class="feedback" role="status"><strong>Practice saved. You showed up.</strong><p>Four replies completed. No fluency or pronunciation score was generated.</p><ul class="checklist"><li>Did you include the phrases you wanted to practice?</li><li>Can you say one reply aloud at your own pace?</li></ul><button id="practiceAgain" class="primary">Practice again</button></div>`:`<div class="bubble"><span class="eyebrow">Prompt ${step+1}</span><p>${esc(sc.steps[step][0])}</p><button data-play="${esc(sc.steps[step][0])}" class="quiet">▷ Listen</button></div><label for="practiceReply">What would you say? (up to 500 characters)</label><textarea id="practiceReply" class="input" rows="3" maxlength="500" placeholder="A short phrase is a great start.">${esc(session.draft)}</textarea><details><summary>Need a hint? Show an example</summary><p>${esc(sc.steps[step][1])}</p></details><div class="actions"><button id="practiceSend" class="primary">${step===3?'Finish & save':'Save my reply'}</button></div><p class="tiny muted">Your draft stays here if you leave. Typed practice is fully supported. No microphone permission is requested.</p>`}`;$('#practiceBack').onclick=()=>{stopAudio();practiceID=null;renderPractice();};if($('#practiceAgain'))$('#practiceAgain').onclick=()=>{if(change(s=>s.practice[practiceID].sessions.push({id:uid(),startedAt:Date.now(),completedAt:null,replies:[],draft:''})))renderPractice();};if($('#practiceReply'))$('#practiceReply').oninput=e=>change(s=>s.practice[practiceID].sessions.at(-1).draft=e.target.value);if($('#practiceSend'))$('#practiceSend').onclick=()=>{if(change(s=>{const p=s.practice[practiceID].sessions.at(-1);if(p.completedAt)return;if(!p.draft.trim())throw Error('Type a reply first. There is no automatic correctness score.');p.replies.push(p.draft.trim());p.draft='';if(p.replies.length===4)p.completedAt=Date.now();})){stopAudio();renderPractice();$('#main').focus();}};bindAudio();}
function renderProgress(){const attempts=state.attempts.filter(a=>a.completedAt),total=attempts.reduce((sum,a)=>sum+summary(a).total,0),correct=attempts.reduce((sum,a)=>sum+summary(a).correct,0),lessons=new Set(attempts.map(a=>a.lesson)).size,practices=Object.values(state.practice).reduce((n,p)=>n+p.sessions.filter(x=>x.completedAt).length,0),mastered=Object.values(state.words).filter(w=>w.mastered).length;$('#main').innerHTML=`<div class="eyebrow">Your effort, honestly counted</div><h1>Look how far<br><span class="accent">you’ve come.</span></h1><p class="muted">No invented scores. Just the practice you actually saved.</p><div class="grid section">${[['Lessons completed',lessons+' / 5'],['First-try accuracy',total?Math.round(correct/total*100)+'%':'—'],['Phrases mastered',mastered+' / '+Object.keys(state.words).length],['Reviews completed',state.reviews.length],['Guided sessions',practices],['Learning streak',streak(state,Date.now())+' days']].map(([t,v])=>`<div class="card"><div class="metric">${v}</div><div class="tiny muted">${t}</div></div>`).join('')}</div><section class="card"><h2>Practice time</h2><p><strong class="mint">${Math.floor(activeMillis(state,Date.now())/60000)} active minutes</strong> saved so far</p><p class="tiny muted">Measured only while a lesson, a due review, or an unfinished guided session is visible and recently interacted with. Idle time after 60 seconds is excluded. Overlapping intervals count once. This is active screen time, not speaking time.</p></section><section class="card"><h2>Your lesson history</h2>${attempts.length?[...attempts].reverse().map(a=>{const r=summary(a);return `<div class="word"><h3>${esc(COURSES.find(l=>l.id===a.lesson).title)}</h3><p class="tiny muted">${esc(new Date(a.completedAt).toLocaleString())} · ${r.correct}/${r.total} first try · ${r.stars} stars</p></div>`;}).join(''):'<p class="muted">Your completed lessons will appear here. Start with a friendly hello.</p>'}</section><details><summary>What these numbers mean</summary><p class="muted tiny">Accuracy includes every completed attempt, including replays, and uses the first answer to each exercise. Streaks count calendar dates with a completed lesson, review, or guided session in your saved time zone. Audio playbacks and typed replies are not evidence of speaking proficiency. Stars reward finishing and exercise accuracy; they are not certification.</p></details>`;}
function showDialog(html,setup){stopAudio();const d=$('#dialog');d.innerHTML=html;if(!d.open)d.showModal();setup?.();const first=d.querySelector('input,select,button');first?.focus();}
function preferences(initial=false){showDialog(`${mascot('',true)}<div class="eyebrow section">${initial?'A welcoming first step':'Your learning setup'}</div><h2 id="dialogTitle">${initial?'Hello. You belong here.':'Make room for English.'}</h2><p class="muted">A beginner English starter with Spanish explanations. No account, ads, or payment. Your progress stays in this browser.</p><label for="native">Your native language (for your profile)</label><select id="native"><option value="es" ${state.prefs.native==='es'?'selected':''}>Spanish</option><option value="other" ${state.prefs.native==='other'?'selected':''}>Another language</option></select><p class="tiny muted">Explanation language: Spanish only in this starter. Target: English (US). Level: Beginner. This does not provide a placement assessment.</p><label for="goal">Your daily active-practice goal</label><select id="goal">${[5,10,15].map(n=>`<option value="${n}" ${n===state.prefs.goal?'selected':''}>${n} minutes</option>`).join('')}</select><p class="tiny muted">Time zone: ${esc(state.prefs.zone)}. No reminders or microphone permissions are requested. Device audio is optional. Clearing browser data removes progress; export a backup in Profile.</p>${legacyRaw&&!loadRaw?'<p class="feedback">Older prototype data was found. It is preserved separately, not automatically migrated. Export it in Profile before clearing browser data.</p>':''}<div class="actions"><button id="savePrefs" class="primary">${initial?'Let’s learn':'Save preferences'}</button>${initial?'':'<button id="cancelPrefs">Cancel</button>'}</div>`,()=>{$('#savePrefs').onclick=()=>{const native=$('#native').value,goal=Number($('#goal').value);if(change(s=>{s.prefs.native=native;s.prefs.goal=goal;s.onboarded=true;})){$('#dialog').close();render();}};if($('#cancelPrefs'))$('#cancelPrefs').onclick=()=>$('#dialog').close();});}
function resetDialog(){showDialog(`<h2 id="dialogTitle">Reset this browser’s progress?</h2><p class="muted">This deletes current Ghost Speak progress in this browser. Export a backup first. Older prototype data will not be deleted.</p><button id="resetExport">Export a backup</button><label for="resetConfirm">Type RESET to confirm</label><input class="input" id="resetConfirm" autocomplete="off"><div class="actions"><button id="doReset" class="danger">Delete current progress</button><button id="cancelReset">Keep progress</button></div>`,()=>{$('#resetExport').onclick=()=>download(loadRaw??lastSaved??JSON.stringify(state),'ghost-speak-backup.json');$('#cancelReset').onclick=()=>$('#dialog').close();$('#doReset').onclick=()=>{if($('#resetConfirm').value!=='RESET'){toast('Type RESET exactly to confirm.');return;}try{const next=fresh(),raw=JSON.stringify(next);localStorage.setItem(KEY,raw);state=next;lastSaved=raw;loadRaw=raw;storageBlocked=false;storageMessage='';$('#dialog').close();practiceID=null;route('learn');preferences(true);}catch(e){toast('Reset failed: '+e.message);}};});}
function renderProfile(){$('#main').innerHTML=`<div class="eyebrow">Your own small corner</div><h1>Made for<br><span class="accent">your pace.</span></h1><section class="card"><h2>Learning preferences</h2><p class="muted">Beginner English (US) · Spanish explanations<br>${state.prefs.goal} active minutes a day<br>Time zone: ${esc(state.prefs.zone)}</p><button id="editPrefs">Edit preferences</button></section><section class="card"><h2>Your data stays with you</h2><p class="muted">Progress is stored in this browser’s local storage. No account, analytics, AI request, or microphone access is included. Browser storage may be cleared by the device or private-browsing mode. Export regularly.</p><div class="actions"><button id="exportProgress">Export progress</button><button id="importProgress">Restore backup</button></div><input hidden type="file" id="backupFile" accept="application/json,.json">${legacyRaw?'<p><button id="exportLegacy" class="quiet">Export older prototype data</button></p>':''}<button id="resetProgress" class="quiet danger" style="margin-top:14px">Reset local progress</button></section><section class="card"><h2>What this starter does—and doesn’t</h2><ul class="checklist muted"><li>5 authored draft lessons, 8 exercises each, 30 phrases, and 3 guided scenarios.</li><li>Deterministic grading, resumable drafts, lesson replay, review scheduling, and export/restore.</li><li>Optional downloaded-device text-to-speech with visible transcripts. Audio is synthesized, not bundled or professionally recorded.</li><li>No live AI, recognition, pronunciation assessment, accounts, purchases, cloud sync, or service-worker installation.</li><li>The full 20-lesson curriculum, educator review, native iOS app, and secure backend remain future work.</li></ul><p class="tiny muted">A single-file web edition. The downloaded HTML contains its lesson content and needs no remote libraries. Host on a stable HTTPS origin for reliable browser storage. Opening a local file may have browser-specific storage limits.</p></section><section class="card"><h2>Accessibility & help</h2><p class="muted">Use keyboard Tab and Enter, browser zoom, or your screen reader. System Reduce Motion is respected. Audio is optional and every listening exercise has a text alternative.</p><button id="runChecks">Run built-in content & logic checks</button><pre id="checkOutput" class="tiny" style="white-space:pre-wrap" role="status"></pre></section>`;$('#editPrefs').onclick=()=>preferences();$('#exportProgress').onclick=()=>download(JSON.stringify(state,null,2),'ghost-speak-progress.json');if($('#exportLegacy'))$('#exportLegacy').onclick=()=>download(legacyRaw,'ghost-speak-legacy.json');$('#resetProgress').onclick=resetDialog;$('#importProgress').onclick=()=>$('#backupFile').click();$('#backupFile').onchange=async e=>{const file=e.target.files[0];if(!file)return;if(file.size>5000000){toast('Backup is too large (maximum 5 MB).');return;}try{const parsed=validateState(JSON.parse(await file.text()));showDialog('<h2 id="dialogTitle">Restore this backup?</h2><p>This replaces current progress. Export your current progress first if you want to keep it.</p><div class="actions"><button id="beforeRestore">Export current</button><button id="doRestore" class="primary">Restore</button><button id="cancelRestore">Cancel</button></div>',()=>{$('#beforeRestore').onclick=()=>download(JSON.stringify(state,null,2),'ghost-speak-before-restore.json');$('#cancelRestore').onclick=()=>$('#dialog').close();$('#doRestore').onclick=()=>{if(persist(parsed)){$('#dialog').close();practiceID=null;render();toast('Backup restored.');}};});}catch(err){toast('Not restored: '+err.message);}};$('#runChecks').onclick=()=>{try{$('#checkOutput').textContent=runChecks();}catch(e){$('#checkOutput').textContent='FAILED: '+e.message;}};}
function runChecks(){let checks=0;function ok(value,message){if(!value)throw Error(message);checks++;}ok(validateContent()>40,'Content validation');ok(COURSES.every(l=>l.exercises.length===8),'Eight exercises per lesson');ok(VOCAB.length===30,'Thirty phrases');ok(normalize('  HELLO!  ')==='hello','Punctuation and case');ok(normalize(' I’m   Ana. ')==="i'm ana",'Curly apostrophe');ok(normalize('café')!==normalize('cafe'),'Preserve meaningful accents');for(const l of COURSES)for(const e of l.exercises){const d=emptyDraft();if(e.kind==='text')d.text=e.accepted[0].toUpperCase();else if(e.kind==='order')d.order=e.answer;else if(e.kind==='match')e.pairs.forEach(p=>d.match[p.id]=p.id);else d.choice=e.answer;ok(grade(e,d),'Accepted answer '+e.id);ok(!grade(e,emptyDraft()),'Reject empty '+e.id);}const s=fresh(),now=Date.UTC(2026,0,1,14);s.prefs.zone='UTC';ok(unlocked(s,COURSES[0])&&!unlocked(s,COURSES[1]),'Initial locks');const a=newAttempt('hello');s.attempts.push(a);s.active=a.id;let refused=false;try{completeAttempt(s,a.id,now);}catch{refused=true;}ok(refused,'Incomplete attempt rejected');a.index=8;a.answers=COURSES[0].exercises.map(e=>({exercise:e.id,firstCorrect:true,correct:true,tries:1,response:emptyDraft()}));ok(completeAttempt(s,a.id,now),'Finish attempt');ok(!completeAttempt(s,a.id,now),'Completion idempotent');ok(unlocked(s,COURSES[1])&&!unlocked(s,COURSES[2]),'Unlock one successor');ok(Object.keys(s.words).length===6,'Save vocabulary once');const w=s.words['hello-v0'],token=w.id+':'+w.due;ok(applyReview(s,w.id,'Again',token,now),'Review accepted');ok(!applyReview(s,w.id,'Again',token,now),'Duplicate review rejected');ok(s.words[w.id].due===now+600000,'Again ten minutes');let rw={interval:0,successDays:[]};ok(schedule(rw,'Easy',now,'UTC').interval===3,'New Easy three days');ok(schedule(rw,'Hard',now,'UTC').interval===1,'New Hard one day');rw=schedule(rw,'Easy',now,'UTC');rw=schedule(rw,'Easy',now+DAY,'UTC');rw=schedule(rw,'Easy',now+2*DAY,'UTC');ok(rw.mastered&&rw.interval===27,'Mastery distinct days and interval');ok(!schedule(rw,'Again',now+3*DAY,'UTC').mastered,'Again clears mastery');ok(schedule({interval:170,successDays:[]},'Easy',now,'UTC').interval===180,'Interval cap');const beforeDST=Date.UTC(2026,2,7,17),due=calendarDue(beforeDST,1,'America/New_York');ok(dayKey(due,'America/New_York')==='2026-03-08'&&dayParts(due,'America/New_York').hour===12,'DST calendar noon');s.intervals=[{start:100,end:300},{start:200,end:400}];ok(activeMillis(s,now)===300,'Overlapping intervals deduplicated');const restored=validateState(JSON.parse(JSON.stringify(s)));ok(restored.attempts[0].completedAt===now&&restored.reviews.length===1,'Persistence round trip');const pending=fresh(),p=newAttempt('hello');p.draft.text='unfinished';pending.attempts.push(p);pending.active=p.id;ok(validateState(JSON.parse(JSON.stringify(pending))).attempts[0].draft.text==='unfinished','Draft survives relaunch');ok(stars(7,8)===2&&stars(8,8)===3&&stars(0,8)===1,'Star boundaries');const bad=copy(s);bad.version=999;let rejected=false;try{validateState(bad);}catch{rejected=true;}ok(rejected,'Unknown backup version rejected');return `ALL TESTS PASSED · ${checks} checks\n5 lessons / 40 exercises / 30 phrases validated.\nThis does not replace real-browser, VoiceOver, or iOS testing.`;}
function isLearning(){return tab==='lesson'&&!activeAttempt()?.completedAt||tab==='words'&&!!reviewID||tab==='practice'&&practiceID&&!practiceSession()?.completedAt;}
function tick(){const now=Date.now(),end=Math.min(now,lastInteraction+60000),start=lastTick;lastTick=now;if(!storageBlocked&&document.visibilityState==='visible'&&isLearning()&&end>start&&end-start<=60000)change(s=>s.intervals.push({start,end}));}
['pointerdown','keydown','input'].forEach(ev=>document.addEventListener(ev,()=>lastInteraction=Date.now(),{passive:true}));document.addEventListener('visibilitychange',()=>{if(document.hidden){tick();stopAudio();}lastTick=Date.now();});window.addEventListener('pagehide',()=>{tick();stopAudio();});window.addEventListener('storage',e=>{if(e.key===KEY){storageBlocked=true;storageMessage='Progress changed in another tab. This tab is read-only until reloaded, to protect saved work.';storageNotice();}});setInterval(tick,15000);document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tick();route(b.dataset.tab);});$('#dialog').addEventListener('cancel',e=>{if(!state.onboarded)e.preventDefault();});$('#logo').innerHTML=mascot('',true);$('#logo').querySelector('svg').style.cssText='width:44px;height:48px';render();if(!state.onboarded&&!storageBlocked)preferences(true);
// Explicit test hooks contain no user data and make real-browser validation possible.
window.GhostSpeakChecks={run:runChecks};
</script>
