<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#101116">
<meta name="description" content="Ghost Speak · 10 English speaking & conversation lessons with Duolingo-style 4-choice challenges, synthesized sound effects, ambient music, and saved progress.">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Ghost Speak">
<title>Ghost Speak · 10 Lessons + Sound Edition</title>
<style>
:root{--bg:#101116;--card:#1b1a26;--card2:#252336;--line:#3b3554;--text:#f6f5fc;--muted:#c2bbd8;--violet:#9b7cf6;--lav:#d6c9ff;--mint:#5fd4a8;--wrong:#ff8a9a;--gold:#ffd27a;--radius:22px;--tap:48px}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:ui-rounded,"SF Pro Rounded",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
body{background:radial-gradient(900px 520px at 50% -10%,#3d2f68 0%,transparent 62%),var(--bg);padding:env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left)}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible{outline:3px solid var(--lav);outline-offset:3px;border-radius:12px}
button:disabled{cursor:default}
.app{max-width:520px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column;padding:14px 18px 220px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:48px}
.bar{flex:1;height:14px;background:var(--card2);border-radius:99px;overflow:hidden;border:1px solid var(--line)}
.bar>i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--mint),#9bf0d2);border-radius:99px;transition:width .5s cubic-bezier(.2,.8,.2,1)}
.sound-btn{min-height:44px;padding:0 14px;border-radius:99px;border:1px solid var(--violet);background:rgba(155,124,246,.16);color:var(--lav);font-weight:700;font-size:14px;white-space:nowrap}
.badge-row{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin:6px 0 2px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border-radius:99px;background:rgba(155,124,246,.18);border:1px solid rgba(214,201,255,.32);color:var(--lav);font-size:13px;font-weight:700}
.pill.mint{background:rgba(95,212,168,.16);border-color:rgba(95,212,168,.4);color:#9bf0d2}
.ghost{width:96px;height:96px;margin:10px auto 6px;display:block;filter:drop-shadow(0 0 22px rgba(201,184,255,.5));animation:float 3.2s ease-in-out infinite}
.ghost.thinking{animation:wobble .6s ease-in-out infinite}
.ghost.celebrate{animation:hop .6s cubic-bezier(.2,.9,.3,1.3) 2}
.ghost.sad{animation:droop 1.2s ease 1}
.ghost.small{width:64px;height:64px;margin:0}
h1{font-size:28px;line-height:1.18;margin:6px 0;font-weight:800;letter-spacing:-.02em}
p{margin:0 0 12px;color:var(--muted);line-height:1.5;font-size:16px}
.center{text-align:center}
.screen{animation:fadeUp .35s ease both}
.tag{display:inline-block;font-size:14px;font-weight:700;letter-spacing:.02em;color:var(--lav);background:rgba(155,124,246,.2);padding:6px 12px;border-radius:99px}
.prompt{font-size:22px;font-weight:700;line-height:1.35;color:var(--text);margin:14px 0 18px}
.choices{display:grid;gap:12px}
.choice{min-height:var(--tap);padding:14px 16px;border-radius:16px;background:var(--card2);border:2px solid var(--line);text-align:left;font-size:17px;font-weight:600;color:var(--text);transition:transform .15s ease,background .2s,border-color .2s;display:flex;align-items:center;gap:12px}
.choice:hover:not(:disabled){border-color:var(--violet);transform:translateY(-1px)}
.choice:active:not(:disabled){transform:scale(.98)}
.choice .key{flex:0 0 auto;display:inline-grid;place-items:center;width:30px;height:30px;border-radius:8px;background:var(--bg);color:var(--lav);font-size:15px;font-weight:700}
.choice.right{border-color:var(--mint);background:rgba(95,212,168,.2);animation:pop .4s ease}
.choice.wrong{border-color:var(--wrong);background:rgba(255,138,154,.16);animation:shake .4s ease}
.choice.dim{opacity:.55}
.feedback{position:fixed;left:0;right:0;bottom:0;padding:18px 18px calc(18px + env(safe-area-inset-bottom));background:var(--card);border-top:2px solid var(--line);transform:translateY(110%);transition:transform .35s cubic-bezier(.2,.9,.3,1);z-index:5}
.feedback.show{transform:translateY(0)}
.feedback.ok{background:#19352e;border-color:var(--mint)}
.feedback.bad{background:#3a222d;border-color:var(--wrong)}
.feedback .title{font-size:20px;font-weight:800;margin:0 0 4px;color:var(--text)}
.feedback .why{color:var(--text);margin:0;font-size:16px}
.btn{display:block;width:100%;min-height:var(--tap);padding:14px 18px;border-radius:99px;font-weight:800;font-size:18px;background:linear-gradient(180deg,#c2abff,var(--violet));color:#17112b;box-shadow:0 6px 22px rgba(155,124,246,.35);margin-top:12px;transition:transform .1s}
.btn:active{transform:translateY(2px)}
.btn.ghostly{background:var(--card2);color:var(--lav);box-shadow:none;border:2px solid var(--line)}
.btn.mint{background:linear-gradient(180deg,#8fe8c8,var(--mint));box-shadow:0 6px 20px rgba(95,212,168,.3);color:#0f2a20}
.nav{position:fixed;left:0;right:0;bottom:0;display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-width:520px;margin:0 auto;padding:10px 18px calc(10px + env(safe-area-inset-bottom));background:rgba(16,17,22,.94);backdrop-filter:blur(12px);border-top:1px solid var(--line);z-index:4}
.nav button{min-height:var(--tap);border-radius:14px;color:var(--muted);font-weight:700;font-size:15px}
.nav button[aria-current="page"]{color:var(--text);background:var(--card2);box-shadow:inset 0 0 0 1px var(--violet)}
.path{display:grid;gap:12px;margin-top:12px}
.node{display:flex;align-items:center;gap:14px;padding:15px;border-radius:20px;background:var(--card);border:1px solid var(--line);min-height:var(--tap);text-align:left;width:100%}
.node.now{border-color:var(--violet);box-shadow:0 0 24px rgba(155,124,246,.22)}
.node .dot{flex:0 0 auto;width:52px;height:52px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:18px;background:var(--card2);border:3px solid var(--line)}
.node.done .dot{background:var(--mint);border-color:var(--mint);color:#0f2a20}
.node.now .dot{background:var(--violet);border-color:var(--lav);color:#1a1430;animation:glow 1.6s ease-in-out infinite}
.node:disabled{opacity:.52}
.node strong{display:block;font-size:17px}
.node small{color:var(--muted);font-size:14px}
.stat{display:flex;justify-content:space-between;gap:12px;padding:14px 0;border-bottom:1px solid var(--line);font-size:17px}
.stat b{color:var(--lav)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px;margin:12px 0}
.stars{color:var(--gold);letter-spacing:4px;font-size:20px}
.notice{border-left:4px solid var(--wrong);background:#3d2530;color:#ffd7dd;padding:14px;border-radius:12px;margin:12px 0;font-size:15px}
.spark{position:fixed;width:10px;height:10px;border-radius:3px;pointer-events:none;z-index:9;animation:fall 1.1s ease-out forwards}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
@keyframes wobble{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
@keyframes hop{0%,100%{transform:translateY(0)}40%{transform:translateY(-18px)}70%{transform:translateY(0)}}
@keyframes droop{0%{transform:translateY(0)}50%{transform:translateY(6px) rotate(-6deg)}100%{transform:translateY(0)}}
@keyframes glow{0%,100%{box-shadow:0 0 0 0 rgba(155,124,246,.6)}50%{box-shadow:0 0 0 10px rgba(155,124,246,0)}}
@keyframes pop{0%{transform:scale(.96)}60%{transform:scale(1.03)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes fall{0%{opacity:1;transform:translate(0,0) rotate(0)}100%{opacity:0;transform:translate(var(--dx),var(--dy)) rotate(360deg)}}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}.spark{display:none}}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="bar" role="progressbar" aria-label="Lesson progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="barWrap"><i id="bar"></i></div>
    <button type="button" class="sound-btn" id="soundBtn" aria-pressed="true">Sound on</button>
  </header>
  <main id="main" class="screen" tabindex="-1"></main>
</div>
<nav class="nav" aria-label="Main">
  <button type="button" data-go="learn">Learn (10)</button>
  <button type="button" data-go="review">Review</button>
  <button type="button" data-go="progress">Progress</button>
</nav>
<div class="feedback" id="feedback" role="status" aria-live="polite">
  <p class="title" id="fbTitle"></p>
  <p class="why" id="fbWhy"></p>
  <button type="button" class="btn" id="fbNext">Continue</button>
</div>
<div class="sr" id="announcer" aria-live="assertive"></div>
<script type="module">
export const SCHEMA=1, KEY='ghost-speak-v1', VERSION='Challenge Pack 2';
export function makeRng(seed){let s=seed>>>0;return()=>{s=(s*1664525+1013904223)>>>0;return s/4294967296;};}
export function shuffle(arr,rng){const a=arr.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(rng()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
export function buildQuestion(item,distractors,rng){if(distractors.length!==3)throw Error('Need three distractors');const options=shuffle([item.answer,...distractors],rng);return {...item,options,correctIndex:options.indexOf(item.answer)};}
export function grade(q,k){if(!Number.isInteger(k)||k<0||k>=q.options.length)throw Error('Invalid choice');return k===q.correctIndex;}
export function stars(pct){return pct>=90?3:pct>=70?2:pct>=50?1:0;}
export function lessonSummary(answers){const correct=answers.filter(Boolean).length,pct=answers.length?Math.round(correct/answers.length*100):0;return{correct,total:answers.length,pct,stars:stars(pct)};}
export function freshState(){return{schema:SCHEMA,lessons:{},xp:0};}
export function validState(s){return !!s&&s.schema===SCHEMA&&s.lessons&&typeof s.lessons==='object'&&!Array.isArray(s.lessons)&&Number.isFinite(s.xp)&&s.xp>=0&&Object.values(s.lessons).every(r=>r&&typeof r.done==='boolean'&&Number.isInteger(r.stars)&&r.stars>=0&&r.stars<=3&&Number.isFinite(r.pct)&&r.pct>=0&&r.pct<=100);}
export function loadState(storage){let raw;try{raw=storage.getItem(KEY);}catch{return{error:'unavailable'};}if(!raw)return{state:freshState()};let data;try{data=JSON.parse(raw);}catch{return{error:'corrupt',raw};}if(!validState(data))return{error:'unknown-schema',raw};return{state:data};}
export function saveState(storage,state){if(!validState(state))throw Error('Invalid progress');const json=JSON.stringify(state);storage.setItem(KEY,json);if(storage.getItem(KEY)!==json)throw Error('Save verification failed');return state;}
const pack=(id,title,rows)=>({id,title,items:rows.map((r,i)=>({id:id+'-'+(i+1),prompt:r[0],answer:r[1],wrong:r.slice(2)}))});
export const LESSONS=[

["Someone thanks you for holding the door. Acknowledge their thanks.","You're welcome","I'm sorry about that",'Excuse me, please','Good evening']]),
pack('ordering','Ordering food',[
['Politely order a coffee.',"I'd like a coffee, please",'I like coffee','Give me coffee now','Coffee am I'],
['Order water and nothing else to drink.','Just water, thanks','A coffee as well','Nothing to drink, thanks','Two juices, please'],
['Ask for the bill.','Could we have the bill, please?','Could we see the menu?','Is this table free?','Could we order dessert?'],
['You have a knife but need a fork.','Could I get a fork, please?','Could I get a spoon, please?','Could I get a plate, please?','Could I get a napkin, please?'],
['Ask someone to say their question again.','Sorry, could you repeat that?',"Sorry, I can't stay",'Thanks, that is everything','Yes, I understood perfectly']]),
pack('time','Talking about time',[
["I will call you ___ (the day after today).",'tomorrow','yesterday','last week','two days ago'],
["Complete: Yesterday I ___ home early.",'went','go','going','goes'],
['Describe a completed visit last week.','I went to the park last week','I go to the park last week','I will went to the park',"I'm going to the park next week"],
["She ___ to work every day.",'goes','go','going','gone'],
['Describe a future study plan.',"I'm going to study in the autumn",'I went to study last year','I studied last autumn',"I've already finished studying"]]),
// Ten new authored lessons: 120 four-choice challenges.
pack('smalltalk','Small talk and follow-ups',[
["A colleague asks how your weekend was. Give an answer and return the question.",'It was relaxing, thanks. How was yours?','It was relaxing, thanks. See you tomorrow.','I usually relax on Sundays.','Are you working this weekend?'],

['You know the departure time but not the platform.','Which platform does the train leave from?','What time does the train leave?','How much is the train fare?','How long is the train journey?'],
['Your bus should have arrived ten minutes ago.','The bus is running late.','The bus is ahead of schedule.','The bus has arrived early.','The bus leaves in ten minutes.'],
['Ask about the duration of a trip.','How long does the journey take?','How often does the bus run?','How far is the nearest stop?','How much is a day pass?'],
['Check whether your train goes directly to the airport.','Do I need to change trains?','Do I need to change my seat?','Do I need to change some money?','Do I need to change my name?'],
['Ask how frequently the number 8 bus arrives.','How often does the number 8 run?','How fast does the number 8 travel?','How many seats does the number 8 have?','How far is stop number 8?'],
['Tell a taxi driver your destination.','The Central Hotel on King Street, please.','I came from the Central Hotel.','The Central Hotel opened last year.','I work near the Central Hotel sometimes.'],
['Ask the taxi driver to let you out at this corner.','Could you drop me off here, please?','Could you pick me up tomorrow?','Could you wait outside my office?','Could you take the longer route?'],
['You arrived after the bus had left.','I missed the bus.','I caught the bus.','I changed buses.','I got off the bus.'],
['A sign says the train is cancelled. What should you expect?','That train will not run.','That train will leave early.','That train will use a different seat.','That train is already boarding.'],
['You need the next stop, not the current one.','What is the next stop?','Which stop is this?','Where did we start?','What was the previous stop?'],
['The ticket machine rejected your payment. Ask staff for help.',"My payment didn't go through. Could you help?",'My ticket has already been checked.','I would like to report a lost suitcase.','My train arrived earlier than expected.']]),
pack('workday','Work and polite requests',[
['Ask a colleague for help without demanding it.','Could you help me with this report?','You must finish my report immediately.','Why have you not done my report?','This report is now your responsibility.'],
['The deadline is impossible. Request more time.','Would it be possible to extend the deadline?','Could we bring the deadline forward?','Could we cancel all future meetings?','Would you like an earlier deadline?'],

pack('travelstay','Hotels and travel problems',[

export function validateContent(lessons){const errors=[],ids=new Set();if(!Array.isArray(lessons)||!lessons.length)return['No lessons'];for(const l of lessons){if(!l.id||ids.has(l.id))errors.push('Duplicate or missing lesson id: '+l.id);ids.add(l.id);if(!l.title?.trim()||!Array.isArray(l.items)||!l.items.length){errors.push('Empty lesson: '+l.id);continue;}for(const it of l.items){if(!it.id||ids.has(it.id))errors.push('Duplicate item id: '+it.id);ids.add(it.id);if(!it.prompt?.trim()||!it.answer?.trim())errors.push('Empty item: '+it.id);if(!Array.isArray(it.wrong)||it.wrong.length!==3||it.wrong.some(w=>typeof w!=='string'||!w.trim()))errors.push('Need three distractors: '+it.id);else if(new Set([it.answer,...it.wrong].map(s=>s.trim().toLowerCase())).size!==4)errors.push('Duplicate options: '+it.id);}}return errors;}
export function buildLessonQuestions(l){let seed=0;for(const ch of l.id)seed=(seed*31+ch.charCodeAt(0))>>>0;const rng=makeRng(seed);return l.items.map(it=>buildQuestion(it,it.wrong,rng));}
